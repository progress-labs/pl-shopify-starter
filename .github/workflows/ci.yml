name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format-check

      - name: Build
        run: npx vite build

      - name: Built assets match manifest
        run: node scripts/check-assets-manifest.mjs

  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
          # Blocking at error level — the repo is at 0 errors; keep it there.
          # Warnings (accepted classes documented in .theme-check.yml and the
          # audit) annotate but don't fail.
          flags: '--fail-level error'

  # Lighthouse CI — enable once the four secrets below exist in the repo
  # (Settings > Secrets and variables > Actions). Enforces performance
  # budgets per deploy; would have caught the 220 KB island regression.
